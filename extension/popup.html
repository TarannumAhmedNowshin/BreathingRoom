<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Margin</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- OWNER: Person 1 (extension popup) -->
  <header class="row">
    <img src="../icons/icon128.png" alt="" width="22" height="22">
    <h1>Margin</h1>
    <span id="source" class="pill"></span>
    <button id="open-dashboard" class="ghost" title="Open dashboard">Dashboard</button>
  </header>

  <section id="checkin" class="card" hidden>
    <h3>How's your energy this morning?</h3>
    <div class="row energy">
      <button data-level="low">🪫 Low</button>
      <button data-level="ok">🙂 OK</button>
      <button data-level="high">⚡ High</button>
    </div>
    <p class="muted small">Low energy means a lighter plan with more breaks.</p>
  </section>

  <section id="next" class="card">
    <div class="muted small" id="next-when">Loading your day…</div>
    <h2 id="next-title"></h2>
    <p id="next-idea"></p>
    <div class="row" id="next-actions" hidden>
      <button class="primary" data-action="take">Take it</button>
      <button data-action="snooze">Snooze 10</button>
      <button data-action="skip">Skip</button>
    </div>
  </section>

  <section id="warnings"></section>

  <section>
    <h3 class="section-title">Today</h3>
    <ol id="timeline"></ol>
  </section>

  <section id="tomorrow" class="card" hidden>
    <h3>From yesterday's shutdown</h3>
    <ol id="tomorrow-list"></ol>
  </section>

  <footer class="row">
    <span class="muted small" id="given-back"></span>
    <button id="refresh">Refresh</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
